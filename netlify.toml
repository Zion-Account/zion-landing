# netlify.toml - Netlify configuration for a pnpm workspace
# This version dynamically finds packages under artifacts/ and lib/, builds them,
# then copies the first produced build output containing index.html into netlify_publish/
# which Netlify publishes. It also copies a repo-level _redirects if present.

[build]
  # Enable corepack (pnpm), install dependencies, then build discovered packages under artifacts/ or lib/
  # We avoid running the workspace root build (which runs a global typecheck that fails on Netlify).
  command = "corepack enable && pnpm install --frozen-lockfile && for d in $(find artifacts lib -maxdepth 2 -type f -name package.json -print 2>/dev/null | xargs -n1 dirname); do echo \"Building $d\"; (cd $d && pnpm run build) || true; done && mkdir -p netlify_publish && f=$(find . -type f -name index.html | head -n1) && if [ -n \"$f\" ]; then d=$(dirname \"$f\"); cp -a \"$d/.\" netlify_publish/; if [ -f ./_redirects ]; then cp ./_redirects netlify_publish/_redirects; fi; else echo \"No index.html found after build\"; exit 1; fi"

  # Publish the generated folder that contains the built site
  publish = "netlify_publish"

[context.production.environment]
  # Set Node version to match local dev if needed
  NODE_VERSION = "18"

# Single-page app redirect: send all paths to index.html (prevents 404s on client-side routes)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# NOTES:
# - If you prefer a deterministic configuration, set the Netlify "Base directory" to the specific package
#   (e.g., artifacts/landing), and change the build command to: "corepack enable && pnpm install --frozen-lockfile && pnpm run build"
#   and set publish to that package's output (e.g., "dist").
# - This config assumes at least one package under artifacts/ or lib/ produces an index.html as part of its build.
# - The repo-level _redirects file (if present) will be copied into the published output so SPA redirects are active.
